<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<title>Dashboard QLKT</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    /* ================= REACT-LIKE THEME (Tailwind/Shadcn inspired) ================= */
    :root {
      /* Palette: Slate & Indigo */
      --primary: #6366f1;       /* Indigo 500 */
      --primary-hover: #4f46e5; /* Indigo 600 */
      --bg-body: #f8fafc;       /* Slate 50 */
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;     /* Slate 100 */
      
      --text-main: #0f172a;     /* Slate 900 */
      --text-secondary: #64748b;/* Slate 500 */
      --border: #e2e8f0;        /* Slate 200 */
      
      /* Effects */
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --radius: 12px;
      --transition: all 0.2s ease-in-out;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden; /* Prevent body scroll, handle inside containers */
      display: flex;
    }

    /* ====== SIDEBAR ====== */
    .sidebar {
      width: 260px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      color: var(--primary);
      font-weight: 700;
      font-size: 20px;
    }

    .brand i { font-size: 24px; }

    .nav-menu { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .nav-item {
      padding: 12px 16px;
      border-radius: var(--radius);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: var(--transition);
    }
    .nav-item:hover { background: var(--bg-subtle); color: var(--text-main); }
    .nav-item.active { background: #e0e7ff; color: var(--primary); }

    .footer-info {
        margin-top: auto;
        font-size: 11px;
        color: var(--text-secondary);
        text-align: center;
        padding-top: 20px;
        border-top: 1px solid var(--border);
    }

    /* ====== MAIN CONTENT ====== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .top-bar {
      height: 64px;
      background: var(--bg-surface); /* Glass effect removed for simplicity */
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .page-title h2 { font-size: 18px; font-weight: 600; }
    .page-title span { font-size: 12px; color: var(--text-secondary); margin-left: 8px; }

    /* FILTERS styled like React Components */
    .controls-area { display: flex; gap: 12px; align-items: center; }
    
    .select-wrapper { position: relative; }
    .custom-select {
      appearance: none;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 8px 32px 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-main);
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .custom-select:hover { border-color: #cbd5e1; }
    .custom-select:focus { outline: 2px solid #c7d2fe; border-color: var(--primary); }
    
    .select-wrapper i {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      font-size: 10px; color: var(--text-secondary); pointer-events: none;
    }

    /* SCROLLABLE CONTENT AREA */
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      scroll-behavior: smooth;
    }

    .grid-container {
      display: grid;
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ====== CARDS ====== */
    .card {
      background: var(--bg-surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .card-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    
    /* KPI Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-subtle);
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      transition: var(--transition);
    }
    .stat-card:hover { border-color: #cbd5e1; transform: translateY(-2px); }
    
    .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); margin-bottom: 8px; }
    .stat-value { font-size: 24px; font-weight: 700; color: var(--text-main); line-height: 1; }
    .stat-meta { font-size: 11px; margin-top: 6px; display: flex; align-items: center; gap: 4px; }
    .tag { padding: 2px 8px; border-radius: 99px; font-weight: 500; font-size: 10px; }
    .tag.green { background: #dcfce7; color: #166534; }
    .tag.blue { background: #dbeafe; color: #1e40af; }
    .tag.orange { background: #ffedd5; color: #9a3412; }

    /* Charts Layout */
    .charts-row { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    @media(max-width: 1000px) { .charts-row { grid-template-columns: 1fr; } }

    /* ====== TABLE ====== */
    .table-container {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg-surface);
    }
    
    .table-header {
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    
    .table-row, .table-header {
      display: grid;
      grid-template-columns: var(--cols); /* Dynamic Cols */
      padding: 12px 16px;
      gap: 12px;
      align-items: center;
    }
    
    .table-body { max-height: 500px; overflow-y: auto; font-size: 13px; }
    .table-row { border-bottom: 1px solid var(--border); transition: background 0.1s; }
    .table-row:last-child { border-bottom: none; }
    .table-row:hover { background: #f8fafc; }
    
    .table-row div {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* PAGINATION */
    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg-surface);
    }
    .page-info { font-size: 12px; color: var(--text-secondary); }
    .page-btns button {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-main);
      transition: var(--transition);
    }
    .page-btns button:hover:not(:disabled) { background: var(--bg-subtle); border-color: #cbd5e1; }
    .page-btns button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* UTILS */
    .loading-overlay { 
        position: absolute; top:0; left:0; width:100%; height:100%; 
        background: rgba(255,255,255,0.8); z-index: 50; 
        display:flex; flex-direction:column; justify-content:center; align-items:center;
        backdrop-filter: blur(2px);
    }
    .spinner {
        width: 40px; height: 40px; border: 3px solid #e2e8f0; 
        border-top-color: var(--primary); border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      body { flex-direction: column; overflow: auto; height: auto; }
      .sidebar { width: 100%; height: auto; padding: 12px 24px; flex-direction: row; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
      .nav-menu { display: none; } /* Hide menu on mobile for simplicity */
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .top-bar { flex-direction: column; height: auto; padding: 12px; gap: 12px; align-items: flex-start; }
      .controls-area { width: 100%; flex-wrap: wrap; }
      .content-scroll { padding: 16px; }
    }
</style>
</head>

<script>

     blue: "#6366f1", // Indigo
     teal: "#14b8a6", // Teal
     amber: "#f59e0b", // Amber
     rose: "#f43f5e", // Rose
     slate: "#64748b",
     palette: ["#6366f1", "#06b6d4", "#10b981", "#84cc16", "#f59e0b", "#f97316", "#ef4444", "#ec4899", "#d946ef", "#8b5cf6"]

  // ====== SCHEMA ======

    }
  };

  // ====== DATA FETCHING ======
  async function fetchSheetJSON(spreadsheetId, sheetName) {
    const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
    const res = await fetch(url);
    const raw = await res.text();
    return JSON.parse(raw.substring(raw.indexOf('{'), raw.lastIndexOf('}') + 1));
  }

  function parseTable(gvizJson) {
    const cols = gvizJson.table.cols.map(c => c.label);
    return gvizJson.table.rows.map(r => {
      const obj = {};
      r.c.forEach((cell, i) => obj[cols[i]] = cell ? cell.v : "");
      return obj;
    });
  }

  // ====== UTILS ======
  function parseDateString(s) {
    if (s === null || s === undefined) return null;
    if (s instanceof Date) return { day: s.getDate(), month: s.getMonth() + 1, year: s.getFullYear() };
    const str = String(s).trim();
    if (str.includes("Date")) {
        let m = str.match(/Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)/);
        if (m) return { year: +m[1], month: +m[2] + 1, day: +m[3] };
    }
    let m = str.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/); if (m) return { day:+m[1], month:+m[2], year:+m[3] };
    m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if (m) return { year:+m[1], month:+m[2], day:+m[3] };
    if (!isNaN(Number(str)) && Number(str) > 59) {
      const date = new Date(Math.round((Number(str) - 25569) * 86400 * 1000));
      return { day: date.getUTCDate(), month: date.getUTCMonth() + 1, year: date.getUTCFullYear() };
    }
    return null;
  }

  function getMonth(row) {
    const keys = ["Ngày", "Ngay", "Date", "date", "Ngày ký", "Ngày nghiệm thu", "Ngày nhận HS"];
    for (const k of keys) {
      if (row[k]) {
        const d = parseDateString(row[k]);
        if (d?.month) return d.month;
      }
    }
    if (row.Month) return Number(row.Month);
    return null;
  }

  function getYear(row) {
    const yearKeys = ["Year", "Năm", "Nam", "year"];
    for (const k of yearKeys) if (row[k]) return Number(row[k]);
    const dateKeys = ["Ngày", "Ngay", "Date", "date", "Ngày ký", "Ngày nghiệm thu", "Ngày nhận HS"];
    for (const k of dateKeys) {
      if (row[k]) { const d = parseDateString(row[k]); if(d?.year) return d.year; }
    }
    return null;
  }

  function rowHasMeaningfulData(row) {
    return Object.values(row).some(v => v && String(v).trim() !== "" && String(v) !== "1899");
  }

  function applyFiltersToData(data) {
    const year = yearFilter.value;
    const month = monthFilter.value;
    return data.filter(r => {
      const y = getYear(r);
      const m = getMonth(r);
      if (year !== "all" && String(y) !== String(year)) return false;
      if (month !== "all" && String(m) !== String(month)) return false;
      return true;
    });
  }

  function safe(v) { return (v === null || v === undefined) ? "" : String(v); }

  // ====== RENDER TABLE ======
  function renderTablePage() {
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageRows = currentTableData.slice(start, start + PAGE_SIZE);

    tableBody.innerHTML = pageRows.map(r =>
      `<div class="table-row">
        ${currentSchema.tableCols.map(c => `<div title="${safe(r[c.key])}">${safe(r[c.key])}</div>`).join("")}
      </div>`
    ).join("");

    const totalPages = Math.ceil(currentTableData.length / PAGE_SIZE) || 1;
    pageInfo.textContent = `Trang ${currentPage} / ${totalPages} (${currentTableData.length} dòng)`;

    firstBtn.disabled = currentPage === 1;
    prevBtn.disabled  = currentPage === 1;
    nextBtn.disabled  = currentPage === totalPages;
    lastBtn.disabled  = currentPage === totalPages;
  }

  function renderTable(schema, filteredData) {
    currentSchema = schema;
    if (dataTypeFilter.value === "TONG_CONG") {
        const yearCounts = aggregateYearCounts();
        currentTableData = yearFilter.value === "all" ? yearCounts : yearCounts.filter(y => String(y.Year) === String(yearFilter.value));
        pagination.style.display = "none";
    } else {
        currentTableData = filteredData.filter(rowHasMeaningfulData);
        pagination.style.display = currentTableData.length > PAGE_SIZE ? "flex" : "none";
    }
    
    currentPage = 1;
    const cols = schema.tableCols;
    const colTemplate = cols.map(c => c.width || "1fr").join(" ");
    tableHeader.style.setProperty("--cols", colTemplate);
    tableBody.style.setProperty("--cols", colTemplate);
    tableHeader.innerHTML = cols.map(c => `<div>${c.label}</div>`).join("");
    renderTablePage();
  }

  firstBtn.onclick = () => { currentPage = 1; renderTablePage(); };
  prevBtn.onclick  = () => { if (currentPage > 1) currentPage--; renderTablePage(); };
  nextBtn.onclick  = () => { currentPage++; renderTablePage(); };
  lastBtn.onclick  = () => { currentPage = Math.ceil(currentTableData.length / PAGE_SIZE); renderTablePage(); };

  // ====== CHARTS & KPI ======
  function renderKPIData(filtered) {
    const total = filtered.filter(r => rowHasMeaningfulData(r)).length;
    let avgProgress = "N/A";
    const percentKeys = ["Đánh giá tỉ lệ hoàn thành công việc", "Tỉ lệ hoàn thành"];
    
    // Find progress
    for (const k of percentKeys) {
      const nums = filtered.map(r => {
        let val = String(r[k] ?? "").replace("%", "");
        return parseFloat(val);
      }).filter(n => !isNaN(n));
      if (nums.length) { 
          avgProgress = Math.round(nums.reduce((s, n) => s + n, 0) / nums.length) + "%"; 
          break; 
      }
    }

    // Build KPI HTML
    kpiGrid.innerHTML = `
      <div class="stat-card">
        <div class="stat-label">Tổng bản ghi</div>
        <div class="stat-value">${total}</div>
        <div class="stat-meta"><span class="tag blue">Live Data</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Tỉ lệ hoàn thành (TB)</div>
        <div class="stat-value">${avgProgress}</div>
        <div class="stat-meta"><span class="tag green">AVG</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Phạm vi năm</div>
        <div class="stat-value">${yearFilter.value === "all" ? "Tất cả" : yearFilter.value}</div>
        <div class="stat-meta"><span class="tag orange">Filter</span></div>
      </div>
       <div class="stat-card">
        <div class="stat-label">Loại Dữ liệu</div>
        <div class="stat-value" style="font-size:18px">${TYPE_SCHEMAS[dataTypeFilter.value].label}</div>
         <div class="stat-meta"><span class="tag blue">Active</span></div>
      </div>
    `;
  }

  const CHART_OPTS = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
        legend: { labels: { usePointStyle: true, boxWidth: 8, font: {family: "'Inter', sans-serif"} } }
    },
    scales: { 
        x: { grid: {display: false} },
        y: { beginAtZero: true, border: {dash: [4, 4]} }
    }
  };

  function renderMonthChart(filtered) {
    const months = Array.from({ length: 12 }, (_, i) => i + 1);
    const data = months.map(m => filtered.filter(r => getMonth(r) === m && rowHasMeaningfulData(r)).length);

    const ctx = document.getElementById("monthChart").getContext("2d");
    if (chart) chart.destroy();
    chart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: months.map(m => "T" + m),
        datasets: [{
          label: 'Số lượng',
          data: data,
          backgroundColor: COLORS.blue,
          borderRadius: 4,
          maxBarThickness: 40
        }]
      },
      options: CHART_OPTS
    });
  }

  function renderPieChart() {
    const filterFn = ds => applyFiltersToData(ds).filter(r => rowHasMeaningfulData(r)).length;
    const d = [ filterFn(dataQLKT), filterFn(dataTRINH_VB), filterFn(dataNGHIEM_THU_NB), filterFn(dataNHANTRAHS) ];

    const ctx = document.getElementById("pieChart").getContext("2d");
    if (pie) pie.destroy();
    pie = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: ["QLKT", "Trình VB", "Nghiệm thu", "Hồ sơ"],
        datasets: [{ data: d, backgroundColor: [COLORS.blue, COLORS.teal, COLORS.amber, COLORS.rose], borderWidth: 0 }]
      },
      options: { 
          responsive: true, maintainAspectRatio: false, 
          cutout: '65%',
          plugins: { legend: { position: 'right', labels: { boxWidth: 10 } } } 
      }
    });
  }

  function populateBreakdownOptions() {
    const candidateFields = [
      "Chuyên viên phụ trách", "Đơn vị thực hiện", "Chủ nhiệm", "Mục đích trình",
      "Lãnh đạo ký", "Nhân viên soạn thảo văn bản", "Đánh giá tỉ lệ hoàn thành công việc",
      "Tên dự án", "Người nhận HS"
    ];

    let sourceData = getCurrentSourceData();
    const available = candidateFields.filter(f => sourceData.some(r => r[f]));
    
    breakdownField.innerHTML = `<option value="none">-- Chọn trường phân tích --</option>` +
      available.map(k => `<option value="${encodeURIComponent(k)}">${k}</option>`).join("");
    
    breakdownField.value = "none";
    if (breakdownChart) { breakdownChart.destroy(); breakdownChart = null; }
  }

  function renderBreakdownPie(fieldEncoded) {
    if (!fieldEncoded || fieldEncoded === "none") return;
    const fieldKey = decodeURIComponent(fieldEncoded);
    let filtered = applyFiltersToData(getCurrentSourceData()).filter(r => rowHasMeaningfulData(r));
    
    const counts = {};
    filtered.forEach(r => {
        const val = r[fieldKey];
        if(val) counts[val] = (counts[val] || 0) + 1;
    });

    const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
    const top = sorted.slice(0, 8);
    if(sorted.length > 8) top.push(["Khác", sorted.slice(8).reduce((acc, curr) => acc + curr[1], 0)]);

    const ctx = document.getElementById("breakdownPie").getContext("2d");
    if (breakdownChart) breakdownChart.destroy();
    breakdownChart = new Chart(ctx, {
      type: "pie",
      data: {
        labels: top.map(i => i[0]),
        datasets: [{ data: top.map(i => i[1]), backgroundColor: COLORS.palette, borderWidth: 1, borderColor: '#fff' }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: {boxWidth: 8} } } }
    });
  }

  // ====== MAIN LOGIC ======
  function getCurrentSourceData() {
    switch(dataTypeFilter.value) {
        case "QLKT": return dataQLKT;
        case "TRINH_VB": return dataTRINH_VB;
        case "NGHIEM_THU_NB": return dataNGHIEM_THU_NB;
        case "NHANTRAHS": return dataNHANTRAHS;
        default: return [...dataQLKT, ...dataTRINH_VB, ...dataNGHIEM_THU_NB, ...dataNHANTRAHS];
    }
  }

  function updateAll() {
    const type = dataTypeFilter.value;
    
    if (type === "TONG_CONG") {
        renderTable(TYPE_SCHEMAS[type], []);
        kpiGrid.innerHTML = `<div class="stat-card" style="grid-column: span 4; text-align:center; color: var(--text-secondary)">Chế độ xem tổng hợp</div>`;
        if (chart) chart.destroy();
        renderPieChart();
        return;
    }

    const data = getCurrentSourceData();
    const filtered = applyFiltersToData(data);

    renderKPIData(filtered);
    renderMonthChart(filtered);
    renderPieChart();
    renderTable(TYPE_SCHEMAS[type], filtered);
    populateBreakdownOptions();
  }

  function aggregateYearCounts() {
     const years = {};
     const count = (arr, key) => arr.forEach(r => {
         if(!rowHasMeaningfulData(r)) return;
         const y = getYear(r);
         if(!y) return;
         if(!years[y]) years[y] = { Year: y, QLKT_Count: 0, TRINH_VB_Count: 0, NGHIEM_THU_NB_Count: 0, NHANTRAHS_Count: 0, TOTAL_Count: 0 };
         years[y][key]++;
         years[y].TOTAL_Count++;
     });
     count(dataQLKT, "QLKT_Count");
     count(dataTRINH_VB, "TRINH_VB_Count");
     count(dataNGHIEM_THU_NB, "NGHIEM_THU_NB_Count");
     count(dataNHANTRAHS, "NHANTRAHS_Count");
     return Object.values(years).sort((a,b) => b.Year - a.Year);
  }

  // ====== INIT ======
  async function init() {
    try {
      loadingOverlay.style.display = "flex";
      const [d1, d2, d3, d4] = await Promise.all([
        fetchSheetJSON(SPREADSHEET_ID_MAIN, SHEET_NAME_DUAN),
        fetchSheetJSON(SPREADSHEET_ID_MAIN, SHEET_NAME_TRINHKY),
        fetchSheetJSON(SPREADSHEET_ID_MAIN, SHEET_NAME_NGHIEMTHU),
        fetchSheetJSON(SPREADSHEET_ID_HS, SHEET_NAME_NHANTRAHS)
      ]);

      dataQLKT = parseTable(d1);
      dataTRINH_VB = parseTable(d2);
      dataNGHIEM_THU_NB = parseTable(d3);
      dataNHANTRAHS = parseTable(d4);

      // Populate Year
      const years = new Set();
      [...dataQLKT, ...dataTRINH_VB, ...dataNGHIEM_THU_NB, ...dataNHANTRAHS].forEach(r => { const y = getYear(r); if(y) years.add(y); });
      [...years].sort((a,b)=>b-a).forEach(y => {
          const opt = document.createElement("option"); opt.value = y; opt.textContent = `Năm ${y}`; yearFilter.appendChild(opt);
      });

      updateAll();
    } catch (e) {
      console.error(e);
      errorBox.style.display = "block";
      errorBox.textContent = "Không thể tải dữ liệu: " + e.message;
    } finally {
      loadingOverlay.style.display = "none";
    }
  }

  dataTypeFilter.addEventListener("change", updateAll);
  yearFilter.addEventListener("change", updateAll);
  monthFilter.addEventListener("change", updateAll);
  breakdownField.addEventListener("change", (e) => renderBreakdownPie(e.target.value));

  init();
</script>
</body>
</html>
