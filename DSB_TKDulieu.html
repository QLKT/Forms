<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Thống kê Tổng hợp QLKT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #0f172a; --sub-primary: #1e293b; --accent: #2563eb;
      --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
      --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text-main: #0f172a; --text-sub: #64748b;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); padding: 24px; line-height: 1.5; }

    /* Layout */
    .dashboard-container { max-width: 1400px; margin: 0 auto; }
    
    .header-section { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; }
    .header-info h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; color: var(--primary); }
    .header-info p { color: var(--text-sub); font-size: 14px; margin-top: 4px; }

    /* Filter Bar */
    .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .filter-card { background: var(--card); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .filter-card label { display: block; font-size: 11px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; margin-bottom: 6px; }
    .filter-card select { width: 100%; border: none; font-size: 15px; font-weight: 600; color: var(--primary); outline: none; background: transparent; cursor: pointer; }

    /* KPI Grid */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
    .kpi-card { background: var(--card); padding: 24px; border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .kpi-card::after { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 4px; background: var(--accent); }
    .kpi-label { font-size: 13px; font-weight: 600; color: var(--text-sub); }
    .kpi-value { font-size: 32px; font-weight: 800; margin: 8px 0; color: var(--primary); }
    .kpi-trend { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; }

    /* Charts Section */
    .main-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; margin-bottom: 32px; }
    .chart-card { background: var(--card); padding: 24px; border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .chart-header { margin-bottom: 20px; }
    .chart-header h3 { font-size: 16px; font-weight: 700; color: var(--primary); }
    .canvas-box { position: relative; height: 350px; }

    /* Table Section */
    .data-table-section { background: var(--card); border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
    .table-controls { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .search-box { background: #f1f5f9; padding: 8px 16px; border-radius: 8px; display: flex; align-items: center; gap: 10px; min-width: 300px; }
    .search-box input { background: transparent; border: none; outline: none; width: 100%; font-size: 14px; }
    
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 16px; background: #f8fafc; font-size: 12px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; border-bottom: 1px solid var(--border); }
    td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }

    #loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .spinner { width: 48px; height: 48px; border: 5px solid #e2e8f0; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p style="margin-top: 16px; font-weight: 600; color: var(--primary)">Đang khởi tạo hệ thống...</p>
</div>

<div class="dashboard-container">
  <div class="header-section">
    <div class="header-info">
      <h1>Thống kê Tổng hợp P.QLKT</h1>
      <p id="currentDate">Báo cáo tổng hợp dữ liệu thời gian thực</p>
    </div>
  </div>

  <div class="filter-grid">
    <div class="filter-card">
      <label>Phân loại dữ liệu</label>
      <select id="dataType">
        <option value="ALL">Tất cả dữ liệu</option>
        <option value="QLKT">Dự án QLKT</option>
        <option value="TRINH_VB">Văn bản Trình ký</option>
        <option value="NGHIEM_THU">Nghiệm thu nội bộ</option>
        <option value="NHAN_TRA">Nhận - Trả hồ sơ</option>
      </select>
    </div>
    <div class="filter-card">
      <label>Thời gian (Năm)</label>
      <select id="yearFilter"><option value="all">Toàn bộ thời gian</option></select>
    </div>
  </div>

  <div class="kpi-grid" id="kpiContainer">
    </div>

  <div class="main-grid">
    <div class="chart-card">
      <div class="chart-header"><h3>Phân tích hiệu suất theo Đơn vị thực hiện</h3></div>
      <div class="canvas-box"><canvas id="barChart"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-header"><h3>Cơ cấu nguồn dữ liệu</h3></div>
      <div class="canvas-box"><canvas id="pieChart"></canvas></div>
    </div>
  </div>

  <div class="data-table-section">
    <div class="table-controls">
      <h3 style="font-size: 16px; font-weight: 700;">Danh mục hồ sơ chi tiết</h3>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-sub)"></i>
        <input type="text" id="tableSearch" placeholder="Tìm kiếm đơn vị, nội dung...">
      </div>
    </div>
    <div class="table-wrapper">
      <table>
        <thead><tr id="tHead"></tr></thead>
        <tbody id="tBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const CONFIG = {
    QLKT: { id: "12VZMuTxWo1o44zYpX2llB2BSGbEgn4nQldCKRUbdmeQ", sheet: "QLKT Data Sort", name: "Dự án QLKT", color: "#2563eb" },
    TRINH_VB: { id: "12VZMuTxWo1o44zYpX2llB2BSGbEgn4nQldCKRUbdmeQ", sheet: "QLKT Trình ký Sort", name: "Văn bản Trình ký", color: "#10b981" },
    NGHIEM_THU: { id: "12VZMuTxWo1o44zYpX2llB2BSGbEgn4nQldCKRUbdmeQ", sheet: "QLKT Nghiệm thu nội bộ Sort", name: "Nghiệm thu NB", color: "#f59e0b" },
    NHAN_TRA: { id: "1nxlqtzGM8eXao25nodxwKr6Cu70BiFJNW12b06zF1d4", sheet: "Nhan-Tra HS trinh ky", name: "Nhận-Trả hồ sơ", color: "#ef4444" }
  };

  let store = { QLKT: [], TRINH_VB: [], NGHIEM_THU: [], NHAN_TRA: [], ALL: [] };
  let charts = {};

  async function fetchAll() {
    const keys = Object.keys(CONFIG);
    for (let key of keys) {
      const url = `https://docs.google.com/spreadsheets/d/${CONFIG[key].id}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(CONFIG[key].sheet)}`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(47, text.length - 2));
      const headers = json.table.cols.map(c => (c.label || "").trim());
      
      const data = json.table.rows.map(r => {
        let row = {};
        r.c.forEach((cell, i) => { if(headers[i]) row[headers[i]] = cell ? (cell.f || cell.v) : ""; });
        return row;
      }).filter(r => r["Ngày"] && !String(r["Ngày"]).includes("1899") && r["Đơn vị thực hiện"]);

      store[key] = data.map(d => ({...d, _type: CONFIG[key].name, _color: CONFIG[key].color}));
      store.ALL = store.ALL.concat(store[key]);
    }
  }

  function renderDashboard() {
    const type = document.getElementById("dataType").value;
    const year = document.getElementById("yearFilter").value;
    const searchTerm = document.getElementById("tableSearch").value.toLowerCase();

    let filtered = store[type].filter(r => {
      const matchYear = (year === "all" || (r["Ngày"] && r["Ngày"].includes(year)));
      const matchSearch = Object.values(r).some(v => String(v).toLowerCase().includes(searchTerm));
      return matchYear && matchSearch;
    });

    // KPI Update
    const kpis = [
      { label: "Dự án QLKT", key: "QLKT" },
      { label: "Văn bản Trình ký", key: "TRINH_VB" },
      { label: "Nghiệm thu NB", key: "NGHIEM_THU" },
      { label: "Nhận-Trả hồ sơ", key: "NHAN_TRA" }
    ];
    document.getElementById("kpiContainer").innerHTML = kpis.map(k => {
      const count = store[k.key].filter(r => year === "all" || r["Ngày"].includes(year)).length;
      return `<div class="kpi-card" style="border-left: 4px solid ${CONFIG[k.key].color}">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value">${count.toLocaleString()}</div>
        <div class="kpi-trend" style="color: var(--success)"><i class="fa-solid fa-check"></i> Đang hoạt động</div>
      </div>`;
    }).join("");

    // Bar Chart (Unit Performance)
    const unitMap = {};
    filtered.forEach(r => {
      const unit = r["Đơn vị thực hiện"] || "Không xác định";
      unitMap[unit] = (unitMap[unit] || 0) + 1;
    });
    const sortedUnits = Object.entries(unitMap).sort((a,b) => b[1] - a[1]).slice(0, 10);

    if(charts.bar) charts.bar.destroy();
    charts.bar = new Chart(document.getElementById("barChart"), {
      type: 'bar',
      data: {
        labels: sortedUnits.map(x => x[0]),
        datasets: [{ label: 'Số lượng hồ sơ', data: sortedUnits.map(x => x[1]), backgroundColor: '#2563eb', borderRadius: 8 }]
      },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });

    // Pie Chart
    const typeCounts = {};
    filtered.forEach(r => { typeCounts[r._type] = (typeCounts[r._type] || 0) + 1; });
    
    if(charts.pie) charts.pie.destroy();
    charts.pie = new Chart(document.getElementById("pieChart"), {
      type: 'doughnut',
      data: {
        labels: Object.keys(typeCounts),
        datasets: [{ data: Object.values(typeCounts), backgroundColor: Object.keys(typeCounts).map(t => Object.values(CONFIG).find(c => c.name === t).color) }]
      },
      options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'bottom' } } }
    });

    // Table
    const cols = (type === "ALL") ? ["Ngày", "Đơn vị thực hiện", "Nguồn dữ liệu", "Nội dung hồ sơ/Hợp đồng", "Trạng thái"] : Object.keys(filtered[0] || {}).filter(k => !k.startsWith('_'));
    document.getElementById("tHead").innerHTML = cols.map(c => `<th>${c}</th>`).join("");
    document.getElementById("tBody").innerHTML = filtered.slice(0, 50).map(r => {
      const content = r["Nội dung hồ sơ"] || r["Tên dự án"] || r["Về việc"] || r["Tên Hợp đồng"] || "";
      const status = r["Trạng thái"] || "N/A";
      if(type === "ALL") {
        return `<tr><td>${r["Ngày"]}</td><td><b>${r["Đơn vị thực hiện"]}</b></td><td><span class="status-badge" style="background:#f1f5f9">${r._type}</span></td><td>${content}</td><td><span class="status-badge" style="background:${status === 'Đã hoàn thành' ? '#dcfce7' : '#fef9c3'}">${status}</span></td></tr>`;
      }
      return `<tr>${cols.map(c => `<td>${r[c] || ""}</td>`).join("")}</tr>`;
    }).join("");
  }

  async function init() {
    await fetchAll();
    const years = [...new Set(store.ALL.map(r => r["Ngày"]?.match(/\d{4}/)?.[0]))].filter(y => y).sort().reverse();
    const ySel = document.getElementById("yearFilter");
    years.forEach(y => ySel.add(new Option(y, y)));

    document.getElementById("loading-overlay").style.display = "none";
    document.getElementById("dataType").onchange = renderDashboard;
    document.getElementById("yearFilter").onchange = renderDashboard;
    document.getElementById("tableSearch").oninput = renderDashboard;
    
    document.getElementById("currentDate").innerText = `Cập nhật lần cuối: ${new Date().toLocaleString('vi-VN')}`;
    renderDashboard();
  }

  init();
</script>
</body>
</html>
