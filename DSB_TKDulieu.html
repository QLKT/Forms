<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Thống kê Tổng hợp QLKT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a; --bg-soft: #111827; --card: #020617;
      --accent: #38bdf8; --text: #e5e7eb; --muted: #9ca3af; --border: #1f2937;
      --radius-lg: 16px; --radius-md: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", sans-serif; background: radial-gradient(circle at top left, #1d283a, #020617 60%); color: var(--text); padding: 20px; }
    .dashboard { max-width: 1280px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .header h1 { font-size: 22px; font-weight: 600; color: var(--accent); }
    
    .filters { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-select { background: var(--bg-soft); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 999px; outline: none; min-width: 150px; font-size: 13px; }

    .grid-main { display: grid; grid-template-columns: 1fr; gap: 20px; }
    .card { background: var(--card); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .kpi-box { background: rgba(56, 189, 248, 0.05); border: 1px solid rgba(56, 189, 248, 0.2); padding: 15px; border-radius: var(--radius-md); }
    .kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
    .kpi-value { font-size: 24px; font-weight: 700; color: var(--accent); }

    .charts-split { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .charts-split { grid-template-columns: 1fr; } }

    .table-container { margin-top: 20px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { background: var(--bg-soft); color: var(--muted); padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
    td { padding: 10px; border-bottom: 1px solid var(--border); color: var(--text); }
    tr:hover { background: rgba(255,255,255,0.02); }
    
    #loading { text-align: center; padding: 40px; color: var(--muted); }
  </style>
</head>
<body>

<div class="dashboard">
  <div class="header">
    <h1><i class="fa-solid fa-chart-line"></i> Dashboard Thống kê QLKT</h1>
    <span style="font-size: 12px; color: var(--muted)">Phiên bản 2026</span>
  </div>

  <div class="filters">
    <div class="filter-group">
      <select id="dataType" class="filter-select">
        <option value="ALL">--- TẤT CẢ DỮ LIỆU ---</option>
        <option value="QLKT">Dự án QLKT</option>
        <option value="TRINH_VB">Văn bản Trình ký</option>
        <option value="NGHIEM_THU">Nghiệm thu Nội bộ</option>
        <option value="NHAN_TRA">Nhận - Trả Hồ sơ</option>
      </select>
    </div>
    <div class="filter-group">
      <select id="yearFilter" class="filter-select"><option value="all">Tất cả các năm</option></select>
    </div>
  </div>

  <div id="loading"><i class="fas fa-spinner fa-spin"></i> Đang tải dữ liệu...</div>

  <div id="mainContent" style="display:none;">
    <div class="kpi-row" id="kpiRow"></div>

    <div class="charts-split">
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-chart-bar"></i> Số lượng theo tháng</div>
        <canvas id="barChart" height="200"></canvas>
      </div>
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-chart-pie"></i> Tỷ trọng phân bổ</div>
        <canvas id="pieChart" height="200"></canvas>
      </div>
    </div>

    <div class="card" style="margin-top: 20px;">
      <div class="card-title"><i class="fa-solid fa-list"></i> Danh sách chi tiết</div>
      <div class="table-container">
        <table id="dataTable">
          <thead><tr id="tHead"></tr></thead>
          <tbody id="tBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const ID_1 = "12VZMuTxWo1o44zYpX2llB2BSGbEgn4nQldCKRUbdmeQ";
  const ID_2 = "1nxlqtzGM8eXao25nodxwKr6Cu70BiFJNW12b06zF1d4"; // File Nhận trả HS

  const CONFIG = {
    QLKT: { id: ID_1, sheet: "QLKT Data Sort", cols: ["Ngày", "Đơn vị thực hiện", "Chuyên viên phụ trách", "Tên dự án"] },
    TRINH_VB: { id: ID_1, sheet: "QLKT Trình ký Sort", cols: ["Ngày", "Lãnh đạo ký", "Về việc", "Nhân viên soạn thảo văn bản"] },
    NGHIEM_THU: { id: ID_1, sheet: "QLKT Nghiệm thu nội bộ Sort", cols: ["Ngày", "Đơn vị thực hiện", "Số Hợp đồng", "Tên Hợp đồng"] },
    NHAN_TRA: { id: ID_2, sheet: "Nhan-Tra HS trinh ky", cols: ["Ngày", "Đơn vị thực hiện", "Nội dung hồ sơ", "Trạng thái"] }
  };

  let store = { QLKT: [], TRINH_VB: [], NGHIEM_THU: [], NHAN_TRA: [], ALL: [] };
  let charts = {};

  async function fetchData(key) {
    try {
      const url = `https://docs.google.com/spreadsheets/d/${CONFIG[key].id}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(CONFIG[key].sheet)}`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(47, text.length - 2));
      const headers = json.table.cols.map(c => (c.label || "").trim());
      
      return json.table.rows.map(r => {
        let row = {};
        r.c.forEach((cell, i) => { if(headers[i]) row[headers[i]] = cell ? (cell.f || cell.v) : ""; });
        return row;
      }).filter(r => {
        // Sửa logic: Tính số lượng bằng cách đếm số hàng có "Đơn vị thực hiện"
        const unit = String(r["Đơn vị thực hiện"] || "").trim();
        const date = String(r["Ngày"] || "");
        return unit !== "" && !date.includes("1899");
      });
    } catch (e) { return []; }
  }

  function getYear(d) { const m = String(d).match(/\d{4}/); return m ? m[0] : null; }
  function getMonth(d) { const p = String(d).split(/[\/\-]/); return p.length > 1 ? parseInt(p[1]) : null; }

  function refresh() {
    const type = document.getElementById("dataType").value;
    const year = document.getElementById("yearFilter").value;
    const current = store[type].filter(r => year === "all" || getYear(r["Ngày"]) === year);

    // KPI
    document.getElementById("kpiRow").innerHTML = `
      <div class="kpi-box"><div class="kpi-label">Tổng bản ghi</div><div class="kpi-value">${current.length}</div></div>
      <div class="kpi-box"><div class="kpi-label">Năm</div><div class="kpi-value">${year === 'all' ? 'Tất cả' : year}</div></div>
      <div class="kpi-box"><div class="kpi-label">Loại</div><div class="kpi-value">${type}</div></div>
    `;

    // Charts
    const mData = Array(12).fill(0);
    const typeCounts = {};
    current.forEach(r => {
      const m = getMonth(r["Ngày"]); if(m) mData[m-1]++;
      const t = r._type || type;
      typeCounts[t] = (typeCounts[t] || 0) + 1;
    });

    if(charts.bar) charts.bar.destroy();
    charts.bar = new Chart(document.getElementById("barChart"), {
      type: 'bar',
      data: {
        labels: Array.from({length:12}, (_,i)=>`T${i+1}`),
        datasets: [{ label: 'Số lượng', data: mData, backgroundColor: '#38bdf8' }]
      },
      options: { responsive: true, scales: { y: { beginAtZero: true, grid: { color: '#1f2937' } } } }
    });

    if(charts.pie) charts.pie.destroy();
    charts.pie = new Chart(document.getElementById("pieChart"), {
      type: 'doughnut',
      data: {
        labels: Object.keys(typeCounts),
        datasets: [{ data: Object.values(typeCounts), backgroundColor: ['#38bdf8', '#34d399', '#fbbf24', '#f87171'] }]
      },
      options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
    });

    // Table
    const cols = (type === "ALL") ? ["Ngày", "Đơn vị thực hiện", "Loại dữ liệu"] : CONFIG[type].cols;
    document.getElementById("tHead").innerHTML = cols.map(c => `<th>${c}</th>`).join("");
    document.getElementById("tBody").innerHTML = current.slice(0, 50).map(r => 
      `<tr>${cols.map(c => `<td>${r[c] || (c==="Loại dữ liệu" ? r._type : "")}</td>`).join("")}</tr>`
    ).join("");
  }

  async function init() {
    const keys = ["QLKT", "TRINH_VB", "NGHIEM_THU", "NHAN_TRA"];
    for(let k of keys) {
      const d = await fetchData(k);
      store[k] = d;
      store.ALL = store.ALL.concat(d.map(item => ({...item, _type: k})));
    }

    const years = [...new Set(store.ALL.map(r => getYear(r["Ngày"])))].filter(y => y).sort().reverse();
    const ySel = document.getElementById("yearFilter");
    years.forEach(y => ySel.add(new Option(y, y)));

    document.getElementById("loading").style.display = "none";
    document.getElementById("mainContent").style.display = "block";
    refresh();
  }

  document.getElementById("dataType").onchange = refresh;
  document.getElementById("yearFilter").onchange = refresh;
  init();
</script>
</body>
</html>
