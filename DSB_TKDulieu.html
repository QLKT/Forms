<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Thống kê Tổng hợp Dữ liệu QLKT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --accent: #0284c7; --text: #1e293b; --muted: #64748b; --border: #e2e8f0;
      --radius-lg: 12px; --radius-md: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; }
    .dashboard { max-width: 1440px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { font-size: 22px; font-weight: 700; color: #0f172a; }

    .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; background: var(--card); padding: 16px; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 20px; }
    .filter-group { display: flex; flex-direction: column; gap: 6px; }
    .filter-group label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
    .filter-select { background: #f1f5f9; border-radius: 8px; border: 1px solid var(--border); padding: 8px; font-size: 14px; outline: none; }

    /* Layout biểu đồ chia đôi song song */
    .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 900px) { .charts-container { grid-template-columns: 1fr; } }
    
    .card { background: var(--card); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column; }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .chart-wrapper { position: relative; flex-grow: 1; min-height: 300px; }

    /* Table */
    .table-container { background: var(--card); border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f1f5f9; padding: 12px; text-align: left; font-weight: 600; color: var(--muted); border-bottom: 2px solid var(--border); }
    td { padding: 12px; border-bottom: 1px solid var(--border); }
    tr:hover { background-color: #f8fafc; }

    .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; padding: 15px; background: #fff; }
    .pg-btn { padding: 6px 12px; border: 1px solid var(--border); background: white; border-radius: 6px; cursor: pointer; }
    .pg-btn:disabled { opacity: 0.5; }

    #loading { text-align: center; padding: 50px; font-weight: 600; color: var(--accent); }
  </style>
</head>
<body>

<div class="dashboard">
  <div class="header">
    <h1><i class="fa-solid fa-chart-line"></i> THỐNG KÊ DỮ LIỆU TỔNG HỢP</h1>
  </div>

  <div class="filters">
    <div class="filter-group">
      <label>Loại dữ liệu</label>
      <select id="dataType" class="filter-select">
        <option value="ALL">--- TẤT CẢ DỮ LIỆU ---</option>
        <option value="QLKT">Dữ liệu Dự án QLKT</option>
        <option value="TRINH_VB">Văn bản Trình ký</option>
        <option value="NGHIEM_THU">Nghiệm thu Nội bộ</option>
        <option value="NHAN_TRA">Nhận - Trả Hồ sơ</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Năm</label>
      <select id="yearFilter" class="filter-select"><option value="all">Tất cả các năm</option></select>
    </div>
    <div class="filter-group">
      <label>Phân tích theo</label>
      <select id="fieldFilter" class="filter-select"></select>
    </div>
  </div>

  <div id="loading"><i class="fas fa-spinner fa-spin"></i> Đang đồng bộ hóa dữ liệu...</div>

  <div id="content" style="display:none;">
    <div class="charts-container">
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-chart-bar"></i> So sánh số lượng</div>
        <div class="chart-wrapper">
          <canvas id="barChart"></canvas>
        </div>
      </div>
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-chart-pie"></i> Tỷ trọng %</div>
        <div class="chart-wrapper">
          <canvas id="pieChart"></canvas>
        </div>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="pagination">
        <button class="pg-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i> Trước</button>
        <span id="pageInfo" style="font-weight:600">Trang 1</span>
        <button class="pg-btn" id="nextBtn">Sau <i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>
  </div>
</div>

<script>
  const ID_1 = "12VZMuTxWo1o44zYpX2llB2BSGbEgn4nQldCKRUbdmeQ";
  const ID_2 = "1nxlqtzGM8eXao25nodxwKr6Cu70BiFJNW12b06zF1d4";

  const SCHEMAS = {
    QLKT: { id: ID_1, sheet: "QLKT Data Sort", cols: ["Ngày", "Chuyên viên phụ trách", "Đơn vị thực hiện", "Tên dự án", "Chủ nhiệm"] },
    TRINH_VB: { id: ID_1, sheet: "QLKT Trình ký Sort", cols: ["Ngày", "Lãnh đạo ký", "Về việc", "Nhân viên soạn thảo văn bản"] },
    NGHIEM_THU: { id: ID_1, sheet: "QLKT Nghiệm thu nội bộ Sort", cols: ["Ngày", "Đơn vị thực hiện", "Tên Hợp đồng", "Tình hình thực hiện"] },
    NHAN_TRA: { id: ID_2, sheet: "Nhan-Tra HS trinh ky", cols: ["Ngày", "Đơn vị thực hiện", "Nội dung hồ sơ", "Người bàn giao", "Trạng thái"] }
  };

  let store = { QLKT: [], TRINH_VB: [], NGHIEM_THU: [], NHAN_TRA: [], ALL: [] };
  let currentRows = [];
  let page = 1;
  const size = 10;
  let chartB = null, chartP = null;

  async function loadData(key) {
    const url = `https://docs.google.com/spreadsheets/d/${SCHEMAS[key].id}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SCHEMAS[key].sheet)}`;
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(47, text.length - 2));
    const labels = json.table.cols.map(c => c.label || "");
    
    return json.table.rows.map(r => {
      let o = {};
      r.c.forEach((cell, i) => { if(labels[i]) o[labels[i]] = cell ? (cell.f || cell.v) : ""; });
      return o;
    }).filter(r => r["Ngày"] && !String(r["Ngày"]).includes("1899"));
  }

  function getYear(d) { const m = String(d).match(/\d{4}/); return m ? m[0] : null; }

  function updateFieldFilter() {
    const type = document.getElementById("dataType").value;
    const fSel = document.getElementById("fieldFilter");
    fSel.innerHTML = "";
    
    if(type === "ALL") {
      fSel.add(new Option("Loại dữ liệu", "type"));
      fSel.add(new Option("Đơn vị thực hiện", "Đơn vị thực hiện"));
    } else {
      SCHEMAS[type].cols.forEach(c => { if(c !== "Ngày") fSel.add(new Option(c, c)); });
    }
  }

  function refresh() {
    const type = document.getElementById("dataType").value;
    const year = document.getElementById("yearFilter").value;
    const field = document.getElementById("fieldFilter").value;

    currentRows = store[type].filter(r => year === "all" || getYear(r["Ngày"]) === year);

    const counts = {};
    currentRows.forEach(r => {
      let val = (field === "type") ? r._tName : (r[field] || "Chưa xác định");
      counts[val] = (counts[val] || 0) + 1;
    });

    const labels = Object.keys(counts);
    const data = Object.values(counts);

    if(chartB) chartB.destroy();
    if(chartP) chartP.destroy();

    const colors = ['#0284c7', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#64748b'];

    // Biểu đồ cột xoay ngang, chiều cao cân bằng với biểu đồ tròn
    chartB = new Chart(document.getElementById("barChart"), {
      type: 'bar',
      data: { labels, datasets: [{ label: 'Số lượng', data, backgroundColor: colors, borderRadius: 4 }] },
      options: { 
        indexAxis: 'y', 
        responsive: true, 
        maintainAspectRatio: false,
        plugins: { legend: { display: false } }
      }
    });

    chartP = new Chart(document.getElementById("pieChart"), {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: colors }] },
      options: { 
        responsive: true, 
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
      }
    });

    renderTable();
  }

  function renderTable() {
    const type = document.getElementById("dataType").value;
    const cols = (type === "ALL") ? ["Ngày", "Nguồn", "Đơn vị thực hiện", "Nội dung chính"] : SCHEMAS[type].cols;
    
    document.getElementById("tableHead").innerHTML = cols.map(c => `<th>${c}</th>`).join("");
    const paginated = currentRows.slice((page-1)*size, page*size);
    
    document.getElementById("tableBody").innerHTML = paginated.map(r => {
      if(type === "ALL") {
        const content = r["Tên dự án"] || r["Về việc"] || r["Tên Hợp đồng"] || r["Nội dung hồ sơ"] || "";
        return `<tr><td>${r["Ngày"]}</td><td>${r._tName}</td><td>${r["Đơn vị thực hiện"] || ""}</td><td>${content}</td></tr>`;
      }
      return `<tr>${cols.map(c => `<td>${r[c] || ""}</td>`).join("")}</tr>`;
    }).join("");

    const total = Math.ceil(currentRows.length / size) || 1;
    document.getElementById("pageInfo").innerText = `Trang ${page} / ${total}`;
    document.getElementById("prevBtn").disabled = page === 1;
    document.getElementById("nextBtn").disabled = page >= total;
  }

  async function init() {
    const keys = ["QLKT", "TRINH_VB", "NGHIEM_THU", "NHAN_TRA"];
    const names = ["Dự án QLKT", "Văn bản Trình ký", "Nghiệm thu NB", "Nhận-Trả Hồ sơ"];
    
    for(let i=0; i<keys.length; i++) {
      const data = await loadData(keys[i]);
      store[keys[i]] = data;
      store.ALL = store.ALL.concat(data.map(d => ({...d, _tName: names[i]})));
    }

    const years = [...new Set(store.ALL.map(d => getYear(d["Ngày"])))].filter(y => y).sort().reverse();
    const ySel = document.getElementById("yearFilter");
    years.forEach(y => ySel.add(new Option(y, y)));

    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
    updateFieldFilter();
    refresh();
  }

  document.getElementById("dataType").onchange = () => { page=1; updateFieldFilter(); refresh(); };
  document.getElementById("yearFilter").onchange = () => { page=1; refresh(); };
  document.getElementById("fieldFilter").onchange = () => refresh();
  document.getElementById("prevBtn").onclick = () => { if(page>1) { page--; renderTable(); } };
  document.getElementById("nextBtn").onclick = () => { if(page * size < currentRows.length) { page++; renderTable(); } };

  init();
</script>
</body>
</html>
