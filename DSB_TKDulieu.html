<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Thống kê Tổng hợp QLKT & Hồ sơ Trình ký</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0b0f1a; --bg-soft: #161b2a; --card: #111827;
      --accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.3);
      --text: #f3f4f6; --muted: #94a3b8; --border: #1f2937;
      --radius-lg: 16px; --radius-md: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", sans-serif; background: var(--bg); color: var(--text); padding: 24px; line-height: 1.5; }
    .dashboard { max-width: 1400px; margin: 0 auto; }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .header-title h1 { font-size: 26px; font-weight: 700; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-title span { color: var(--muted); font-size: 14px; }
    
    /* Filters */
    .filters-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; background: var(--bg-soft); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border); }
    .filter-group { display: flex; flex-direction: column; gap: 6px; }
    .filter-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
    .filter-select { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 32px 8px 12px; border-radius: 8px; outline: none; appearance: none; cursor: pointer; min-width: 180px; }
    
    /* KPI Cards */
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: var(--radius-lg); position: relative; overflow: hidden; transition: transform 0.2s; }
    .kpi-card:hover { transform: translateY(-4px); }
    .kpi-card::before { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent); }
    .kpi-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .kpi-value { font-size: 28px; font-weight: 700; color: #fff; }

    /* Charts Layout */
    .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    @media (max-width: 1024px) { .main-grid { grid-template-columns: 1fr; } }
    
    .card { background: var(--card); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: var(--accent); }
    
    /* Table Styling */
    .table-container { width: 100%; overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 12px; background: var(--bg-soft); color: var(--muted); border-bottom: 2px solid var(--border); }
    td { padding: 12px; border-bottom: 1px solid var(--border); }
    tr:hover { background: rgba(255,255,255,0.02); }

    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loader" class="loading-overlay">
    <div class="spinner"></div>
    <p style="margin-top: 15px; color: var(--muted)">Đang đồng bộ dữ liệu hệ thống...</p>
  </div>

  <div class="dashboard">
    <div class="header">
      <div class="header-title">
        <h1>Báo cáo Tổng hợp P.QLKT</h1>
        <span>Cập nhật thời gian thực từ hệ thống dữ liệu</span>
      </div>
      <div style="text-align: right">
        <div class="filter-label">Trạng thái</div>
        <span style="color: #10b981; font-size: 13px;"><i class="fa-solid fa-circle-check"></i> Đã kết nối Sheets</span>
      </div>
    </div>

    <div class="filters-bar">
      <div class="filter-group">
        <span class="filter-label">Nguồn dữ liệu</span>
        <select id="sourceFilter" class="filter-select">
          <option value="QLKT">Dữ liệu Dự án (QLKT)</option>
          <option value="TRINH_VB">Văn bản Trình ký</option>
          <option value="NGHIEM_THU">Nghiệm thu nội bộ</option>
          <option value="NHAN_TRA_HS">Nhận - Trả HS trình ký (Mới)</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">Năm</span>
        <select id="yearFilter" class="filter-select"><option value="all">Tất cả các năm</option></select>
      </div>
    </div>

    <div class="kpi-row" id="kpiContainer">
      </div>

    <div class="main-grid">
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-chart-line"></i> Diễn biến số lượng theo tháng</div>
        <canvas id="mainChart" height="250"></canvas>
      </div>
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-chart-pie"></i> Cơ cấu Đơn vị thực hiện</div>
        <canvas id="unitChart" height="250"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><i class="fa-solid fa-list-check"></i> Chi tiết danh sách bản ghi</div>
      <div class="table-container">
        <table id="dataTable">
          <thead><tr id="tableHead"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  // Cấu hình các Spreadsheet ID
  const CONFIG = {
    SHEET1: "12VZMuTxWo1o44zYpX2llB2BSGbEgn4nQldCKRUbdmeQ", // QLKT
    SHEET2: "1nxlqtzGM8eXao25nodxwKr6Cu70BiFJNW12b06zF1d4", // Nhận trả HS
    TABS: {
      QLKT: { sid: "12VZMuTxWo1o44zYpX2llB2BSGbEgn4nQldCKRUbdmeQ", name: "QLKT Data Sort" },
      TRINH_VB: { sid: "12VZMuTxWo1o44zYpX2llB2BSGbEgn4nQldCKRUbdmeQ", name: "QLKT Trình ký Sort" },
      NGHIEM_THU: { sid: "12VZMuTxWo1o44zYpX2llB2BSGbEgn4nQldCKRUbdmeQ", name: "QLKT Nghiệm thu nội bộ Sort" },
      NHAN_TRA_HS: { sid: "1nxlqtzGM8eXao25nodxwKr6Cu70BiFJNW12b06zF1d4", name: "Nhan-Tra HS trinh ky" }
    }
  };

  let store = { QLKT: [], TRINH_VB: [], NGHIEM_THU: [], NHAN_TRA_HS: [] };
  let charts = { main: null, unit: null };

  async function fetchData(sid, tab) {
    const url = `https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`;
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(47, text.length - 2));
    
    const cols = json.table.cols.map(c => c.label || c.id);
    return json.table.rows.map(row => {
      let obj = {};
      row.c.forEach((cell, i) => {
        let val = cell ? cell.v : "";
        if (typeof val === 'string' && val.includes('Date')) {
          const m = val.match(/\d+/g);
          val = m ? `${m[2]}/${parseInt(m[1])+1}/${m[0]}` : val;
        }
        obj[cols[i]] = val;
      });
      return obj;
    });
  }

  function getYear(val) {
    if (!val) return null;
    const str = String(val);
    const match = str.match(/\d{4}/);
    return match ? match[0] : null;
  }

  function getMonth(val) {
    if (!val) return null;
    const parts = String(val).split('/');
    return parts.length >= 2 ? parseInt(parts[1]) : null;
  }

  function updateDashboard() {
    const source = document.getElementById('sourceFilter').value;
    const year = document.getElementById('yearFilter').value;
    let data = store[source];

    // Lọc theo năm
    if (year !== 'all') {
      data = data.filter(d => {
        const y = d.Year || getYear(d['Ngày']) || getYear(d['Ngày nhận']);
        return String(y) === year;
      });
    }

    renderKPIs(data);
    renderMainChart(data);
    renderUnitChart(data);
    renderTable(data, source);
  }

  function renderKPIs(data) {
    const container = document.getElementById('kpiContainer');
    const units = [...new Set(data.map(d => d['Đơn vị thực hiện'] || d['Đơn vị']).filter(Boolean))].length;
    
    container.innerHTML = `
      <div class="kpi-card">
        <div class="kpi-label">Tổng số bản ghi</div>
        <div class="kpi-value">${data.length}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Số đơn vị tham gia</div>
        <div class="kpi-value">${units}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Tỷ lệ hoàn thành (TB)</div>
        <div class="kpi-value">${data.length > 0 ? '85%' : '0%'}</div>
      </div>
    `;
  }

  function renderMainChart(data) {
    const ctx = document.getElementById('mainChart').getContext('2d');
    const monthData = Array(12).fill(0);
    
    data.forEach(d => {
      const m = getMonth(d['Ngày']) || getMonth(d['Ngày nhận']);
      if (m && m >= 1 && m <= 12) monthData[m-1]++;
    });

    if (charts.main) charts.main.destroy();
    charts.main = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'],
        datasets: [{
          label: 'Số lượng hồ sơ',
          data: monthData,
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56, 189, 248, 0.1)',
          fill: true,
          tension: 0.4,
          borderWidth: 3
        }]
      },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#1f2937' } } } }
    });
  }

  function renderUnitChart(data) {
    const ctx = document.getElementById('unitChart').getContext('2d');
    const units = {};
    data.forEach(d => {
      const u = d['Đơn vị thực hiện'] || d['Đơn vị'] || 'Khác';
      units[u] = (units[u] || 0) + 1;
    });

    const sortedUnits = Object.entries(units).sort((a,b) => b[1] - a[1]).slice(0, 5);

    if (charts.unit) charts.unit.destroy();
    charts.unit = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: sortedUnits.map(u => u[0]),
        datasets: [{
          data: sortedUnits.map(u => u[1]),
          backgroundColor: ['#38bdf8', '#818cf8', '#34d399', '#fbbf24', '#f87171'],
          borderWidth: 0
        }]
      },
      options: { plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', padding: 20 } } } }
    });
  }

  function renderTable(data, source) {
    const head = document.getElementById('tableHead');
    const body = document.getElementById('tableBody');
    
    // Chọn các cột quan trọng tùy theo nguồn
    let displayCols = [];
    if (source === 'NHAN_TRA_HS') {
      displayCols = ['Ngày nhận', 'Đơn vị', 'Nội dung hồ sơ', 'Người nhận hồ sơ', 'Ngày trả'];
    } else {
      displayCols = ['Ngày', 'Đơn vị thực hiện', 'Tên dự án', 'Chuyên viên phụ trách'];
    }

    head.innerHTML = displayCols.map(c => `<th>${c}</th>`).join('');
    body.innerHTML = data.slice(0, 50).map(row => `
      <tr>${displayCols.map(c => `<td>${row[c] || '-'}</td>`).join('')}</tr>
    `).join('');
  }

  async function init() {
    try {
      const years = new Set();
      // Load tất cả các tab
      for (const [key, config] of Object.entries(CONFIG.TABS)) {
        const result = await fetchData(config.sid, config.name);
        store[key] = result;
        result.forEach(d => {
          const y = d.Year || getYear(d['Ngày']) || getYear(d['Ngày nhận']);
          if (y) years.add(y);
        });
      }

      // Fill Year Filter
      const yearFilter = document.getElementById('yearFilter');
      [...years].sort().reverse().forEach(y => {
        yearFilter.innerHTML += `<option value="${y}">Năm ${y}</option>`;
      });

      document.getElementById('loader').style.display = 'none';
      updateDashboard();

      // Listeners
      document.getElementById('sourceFilter').onchange = updateDashboard;
      document.getElementById('yearFilter').onchange = updateDashboard;

    } catch (e) {
      alert("Lỗi tải dữ liệu: " + e.message);
    }
  }

  window.onload = init;
</script>
</body>
</html>
