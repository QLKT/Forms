<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Thống kê Tổng hợp Dữ liệu QLKT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    /* ================= LIGHT MODE THEME ================= */
    :root {
      --bg: #f8fafc;
      --bg-soft: #f1f5f9;
      --card: #ffffff;
      --accent: #0284c7;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .dashboard { max-width: 1280px; margin: 0 auto; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-title h1 {
      font-size: 22px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title span { font-size: 13px; color: var(--muted); margin-top: 4px; display: block; }

    .pill {
      background: #e0f2fe; border-radius: 999px; padding: 4px 10px;
      font-size: 11px; color: var(--accent); border: 1px solid #bae6fd;
    }

    .filters { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 12px; }
    .filters-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }
    .filter-wrapper { position: relative; }

    .filter-select {
      background: var(--card); border-radius: 999px; border: 1px solid var(--border);
      color: var(--text); padding: 6px 26px 6px 10px; font-size: 13px;
      outline: none; min-width: 160px; appearance: none;
    }

    .filter-wrapper i {
      position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
      font-size: 11px; color: var(--muted); pointer-events: none;
    }

    .grid { display: grid; gap: 16px; }

    .card {
      background: var(--card); border-radius: var(--radius-lg);
      border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(15,23,42,0.06);
      padding: 14px 16px;
    }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 6px; }
    .card-title { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }

    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 4px; }
    @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }

    .kpi-card {
      background: var(--bg-soft); border-radius: var(--radius-md); border: 1px solid var(--border);
      padding: 10px; display: flex; flex-direction: column; gap: 4px;
    }

    .kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .kpi-value-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
    .kpi-value { font-size: 22px; font-weight: 600; }
    .kpi-chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); background: #ffffff; }

    .table-wrapper { margin-top: 8px; border-radius: var(--radius-md); border: 1px solid var(--border); overflow: hidden; }
    .table-header-row, .table-row {
      display: grid; grid-template-columns: var(--cols); font-size: 12px;
      padding: 6px 10px; align-items: center; gap: 8px;
    }
    .table-header-row { background: var(--bg-soft); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .table-body { max-height: 400px; overflow-y: auto; }
    .table-row:nth-child(even) { background: #f8fafc; }

    .loading { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .error { color: #dc2626; font-size: 12px; margin-top: 6px; }

    .pies-row { display:flex; gap:12px; margin-top:12px; flex-wrap: wrap; }
    .pie-card { flex:1; background: var(--bg-soft); border-radius: 12px; padding: 12px; border:1px solid var(--border); }
    canvas { max-width:100%; }

    /* ====== PAGINATION ====== */
    .pagination { display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:12px; color:#64748b; }
    .pagination button { border:1px solid #e2e8f0; background:#fff; border-radius:6px; padding:4px 8px; cursor:pointer; font-size:12px; }
    .pagination button:disabled { opacity:0.5; cursor:not-allowed; }
    .pagination .controls { display:flex; gap:6px; }
</style>
</head>

<body>
<div class="dashboard">

  <div class="header">
    <div class="header-title">
      <h1><i class="fa-solid fa-layer-group"></i> Thống kê tổng hợp Dữ liệu QLKT</h1>

  <div class="filters">

          <select id="yearFilter" class="filter-select">
            <option value="all">Tất cả</option>
          </select>
          <i class="fa-solid fa-chevron-down"></i>
        </div>
      </div>

      <div class="filter-group">
        <span>Tháng</span>
        <div class="filter-wrapper">
          <select id="monthFilter" class="filter-select">
            <option value="all">Cả năm</option>
            <option value="1">01</option><option value="2">02</option>
            <option value="3">03</option><option value="4">04</option>
            <option value="5">05</option><option value="6">06</option>
            <option value="7">07</option><option value="8">08</option>
            <option value="9">09</option><option value="10">10</option>
            <option value="11">11</option><option value="12">12</option>
          </select>
          <i class="fa-solid fa-chevron-down"></i>
        </div>
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title"><i class="fa-solid fa-gauge-high"></i> Chỉ số tổng hợp</div>
        </div>
      </div>

      <div class="kpi-grid" id="kpiGrid"></div>
      <div class="loading" id="loadingKpi">Đang tải dữ liệu…</div>
      <div class="error" id="errorBox" style="display:none"></div>

      <canvas id="monthChart" height="80"></canvas>

      <div class="pies-row">
        <div class="pie-card">
          <div class="card-title"><i class="fa-solid fa-chart-pie"></i> Phân bố loại dữ liệu</div>
          <canvas id="pieChart"></canvas>
        </div>

        <div class="pie-card">
          <div class="card-title"><i class="fa-solid fa-chart-pie"></i> Phân tích theo trường</div>
          <select id="breakdownField" class="filter-select"></select>
          <canvas id="breakdownPie"></canvas>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <i class="fa-solid fa-table-list"></i> Danh sách dữ liệu
        </div>
      </div>

      <div class="table-wrapper">
        <div id="tableHeader" class="table-header-row"></div>
        <div id="tableBody" class="table-body"></div>
      </div>

      <div class="pagination" id="pagination" style="display:none">
        <div id="pageInfo"></div>
        <div class="controls">
          <button id="firstPage">⏮</button>
          <button id="prevPage">◀</button>
          <button id="nextPage">▶</button>
          <button id="lastPage">⏭</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  // ====== CẤU HÌNH GOOGLE SHEETS ======
  const SPREADSHEET_ID_MAIN = "12VZMuTxWo1o44zYpX2llB2BSGbEgn4nQldCKRUbdmeQ";
  const SPREADSHEET_ID_HS   = "1nxlqtzGM8eXao25nodxwKr6Cu70BiFJNW12b06zF1d4";

  const SHEET_NAME_DUAN      = "QLKT Data Sort";
  const SHEET_NAME_TRINHKY   = "QLKT Trình ký Sort";
  const SHEET_NAME_NGHIEMTHU = "QLKT Nghiệm thu nội bộ Sort";
  const SHEET_NAME_NHANTRAHS = "Nhan-Tra HS trinh ky";

  // ====== DOM ELEMENTS ======
  const tableHeader = document.getElementById("tableHeader");
  const tableBody   = document.getElementById("tableBody");
  const pagination  = document.getElementById("pagination");
  const pageInfo    = document.getElementById("pageInfo");
  const firstBtn    = document.getElementById("firstPage");
  const prevBtn     = document.getElementById("prevPage");
  const nextBtn     = document.getElementById("nextPage");
  const lastBtn     = document.getElementById("lastPage");
  
  const dataTypeFilter = document.getElementById("dataTypeFilter");
  const yearFilter     = document.getElementById("yearFilter");
  const monthFilter    = document.getElementById("monthFilter");
  const breakdownField = document.getElementById("breakdownField");
  const kpiGrid        = document.getElementById("kpiGrid");
  const loadingKpi     = document.getElementById("loadingKpi");
  const errorBox       = document.getElementById("errorBox");

  let dataQLKT = [], dataTRINH_VB = [], dataNGHIEM_THU_NB = [], dataNHANTRAHS = [];
  let chart, pie, breakdownChart;
  
  const MONTH_PALETTE = [
    "#38bdf8", "#60a5fa", "#818cf8", "#a78bfa", "#c084fc", "#e879f9", 
    "#f472b6", "#fb7185", "#f87171", "#fb923c", "#fbbf24", "#34d399"
  ];

  /* ===== PAGINATION STATE ===== */
  let currentPage = 1;
  const PAGE_SIZE = 20;
  let currentTableData = [];
  let currentSchema = null;

  // ====== SCHEMA ======
  const TYPE_SCHEMAS = {
    QLKT: { 
        label: "QLKT", 
        tableCols: [ { key: "Ngày", label: "Ngày", width: "1.2fr" }, { key: "Chuyên viên phụ trách", label: "Chuyên viên", width: "1.2fr" }, { key: "Đơn vị thực hiện", label: "Đơn vị thực hiện", width: "1.2fr" }, { key: "Tên dự án", label: "Tên dự án", width: "2fr" }, { key: "Chủ nhiệm", label: "Chủ nhiệm", width: "1fr" }, { key: "Mục đích trình", label: "Mục đích trình", width: "1.4fr" }, { key: "ID", label: "ID", width: "0.8fr" }, { key: "Year", label: "Year", width: "0.8fr" } ] 
    },
    TRINH_VB: { 
        label: "Trình VB", 
        tableCols: [ { key: "Ngày", label: "Ngày", width: "1.2fr" }, { key: "Lãnh đạo ký", label: "Lãnh đạo ký", width: "1.2fr" }, { key: "Về việc", label: "Về việc", width: "1.6fr" }, { key: "Ý kiến chỉ đạo", label: "Ý kiến chỉ đạo", width: "1.6fr" }, { key: "Tóm tắt nội dung và kiến nghị giải quyết", label: "Tóm tắt & Kiến nghị", width: "2fr" }, { key: "Cơ sở ban hành văn bản", label: "Cơ sở ban hành", width: "1.4fr" }, { key: "Nhân viên soạn thảo văn bản", label: "NV soạn thảo", width: "1.2fr" }, { key: "ID", label: "ID", width: "0.8fr" }, { key: "Year", label: "Year", width: "0.8fr" } ] 
    },
    NGHIEM_THU_NB: { 
        label: "Nghiệm thu NB", 
        tableCols: [ { key: "Ngày", label: "Ngày", width: "1fr" }, { key: "Đơn vị thực hiện", label: "Đơn vị thực hiện", width: "1.2fr" }, { key: "Số Hợp đồng", label: "Số HĐ", width: "1fr" }, { key: "Tên Hợp đồng", label: "Tên HĐ", width: "1.6fr" }, { key: "Tình hình thực hiện", label: "Tình hình", width: "1.6fr" }, { key: "Đánh giá tỉ lệ hoàn thành công việc", label: "Tỉ lệ hoàn thành", width: "1fr" }, { key: "Đề nghị Thanh toán", label: "Thanh toán", width: "1fr" }, { key: "Tỉ lệ thanh lý", label: "Tỉ lệ thanh lý", width: "1fr" }, { key: "Đã nộp hồ sơ in (2 dấu) lưu tại Viện", label: "Hồ sơ lưu Viện", width: "1.2fr" }, { key: "ID", label: "ID", width: "0.8fr" }, { key: "Year", label: "Year", width: "0.8fr" } ] 
    },
    NHANTRAHS: { 
        label: "Nhận/Trả Hồ sơ", 
        tableCols: [ { key: "Tên dự án", label: "Tên dự án", width: "1fr" }, { key: "Đơn vị thực hiện", label: "Đơn vị thực hiện", width: "1.2fr" }, { key: "Ngày nhận HS", label: "Ngày nhận HS", width: "1fr" }, { key: "Ngày trả HS", label: "Ngày trả HS", width: "1fr" }, { key: "Ghi chú", label: "Ghi chú", width: "1.6fr" }] 
    },
    TONG_CONG: { 
        label: "Tổng cộng", 
        tableCols: [ { key: "Year", label: "Year", width: "1fr" }, { key: "QLKT_Count", label: "QLKT", width: "1fr" }, { key: "TRINH_VB_Count", label: "Trình VB", width: "1fr" }, { key: "NGHIEM_THU_NB_Count", label: "Nghiệm thu NB", width: "1fr" }, { key: "NHANTRAHS_Count", label: "Nhận/Trả Hồ sơ", width: "1fr" }, { key: "TOTAL_Count", label: "Tổng", width: "1fr" } ] 
    }
  };

  // ====== FETCH GViz ======
  async function fetchSheetJSON(spreadsheetId, sheetName) {
    const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
    const res = await fetch(url);
    const raw = await res.text();
    const start = raw.indexOf('{'), end = raw.lastIndexOf('}');
    return JSON.parse(raw.substring(start, end + 1));
  }

  function parseTable(gvizJson) {
    const cols = gvizJson.table.cols.map(c => c.label);
    return gvizJson.table.rows.map(r => {
      const obj = {};
      r.c.forEach((cell, i) => obj[cols[i]] = cell ? cell.v : "");
      return obj;
    });
  }

  // ====== UTILS: DATE & DATA CHECK ======
  function parseDateString(s) {
    if (s === null || s === undefined) return null;
    if (s instanceof Date) return { day: s.getDate(), month: s.getMonth() + 1, year: s.getFullYear() };
    const str = String(s).trim();
    let m = str.match(/Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)/);
    if (m) return { year: +m[1], month: +m[2] + 1, day: +m[3] };
    m = str.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/); if (m) return { day:+m[1], month:+m[2], year:+m[3] };
    m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if (m) return { year:+m[1], month:+m[2], day:+m[3] };
    m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (m) return { month:+m[1], day:+m[2], year:+m[3] };
    if (!isNaN(Number(str))) {
      const serial = Number(str);
      if (serial > 59) {
        const date = new Date(Math.round((serial - 25569) * 86400 * 1000));
        return { day: date.getUTCDate(), month: date.getUTCMonth() + 1, year: date.getUTCFullYear() };
      }
    }
    return null;
  }

  function getMonth(row) {
    const keys = ["Ngày", "Ngay", "Date", "date", "Ngày ký", "Ngày nghiệm thu", "Ngay ky", "Ngay nghiem thu", "Ngày nhận HS", "Ngày trả HS"];
    for (const k of keys) {
      if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== "") {
        const d = parseDateString(row[k]);
        if (d?.month >= 1 && d.month <= 12) return d.month;
      }
    }
    if (row.Month) {
      const m = Number(row.Month);
      if (!isNaN(m) && m >= 1 && m <= 12) return m;
    }
    return null;
  }

  function getYear(row) {
    const yearKeys = ["Year", "Năm", "Nam", "year", "YEAR"];
    for (const k of yearKeys) {
      if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== "") {
        const y = Number(row[k]);
        if (!isNaN(y) && y >= 1900 && y <= 2100) return y;
      }
    }
    const dateKeys = ["Ngày", "Ngay", "Date", "date", "Ngày ký", "Ngày nghiệm thu", "Ngày nhận HS", "Ngày trả HS"];
    for (const k of dateKeys) {
      if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== "") {
        const d = parseDateString(row[k]);
        if (d?.year) return d.year;
      }
    }
    return null;
  }

  function rowHasMeaningfulData(row) {
    for (const v of Object.values(row)) {
      if (v === null || v === undefined) continue;
      const s = String(v).trim();
      if (s === "") continue;
      if (s.includes("1899-12") || s === "1899") continue; 
      return true;
    }
    return false;
  }

  function applyFiltersToData(data) {
    const year = yearFilter.value;
    const month = monthFilter.value;
    return data.filter(r => {
      const y = getYear(r);
      const m = getMonth(r);
      if (year !== "all" && String(y) !== String(year)) return false;
      if (month !== "all" && String(m) !== String(month)) return false;
      return true;
    });
  }

  // ====== RENDER TABLE & PAGINATION ======
  function safe(v) { return (v === null || v === undefined) ? "" : String(v); }

  function renderTablePage() {
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageRows = currentTableData.slice(start, start + PAGE_SIZE);

    tableBody.innerHTML = pageRows.map(r =>
      `<div class="table-row">
        ${currentSchema.tableCols.map(c => `<div>${safe(r[c.key])}</div>`).join("")}
      </div>`
    ).join("");

    const totalPages = Math.ceil(currentTableData.length / PAGE_SIZE) || 1;
    pageInfo.textContent = `Trang ${currentPage} / ${totalPages} – Tổng ${currentTableData.length} bản ghi`;

    firstBtn.disabled = currentPage === 1;
    prevBtn.disabled  = currentPage === 1;
    nextBtn.disabled  = currentPage === totalPages;
    lastBtn.disabled  = currentPage === totalPages;
  }

  function renderTable(schema, filteredData) {
    currentSchema = schema;
    
    // Xử lý riêng cho TONG_CONG
    if (dataTypeFilter.value === "TONG_CONG") {
        const yearCounts = aggregateYearCounts();
        currentTableData = yearFilter.value === "all" ? yearCounts : yearCounts.filter(y => String(y.Year) === String(yearFilter.value));
        pagination.style.display = "none"; // Bảng tổng cộng thường ngắn, không cần phân trang
    } else {
        currentTableData = filteredData.filter(rowHasMeaningfulData);
        if (currentTableData.length > PAGE_SIZE) {
            pagination.style.display = "flex";
        } else {
            pagination.style.display = "none";
        }
    }
    
    currentPage = 1;

    // Render Headers
    const cols = schema.tableCols;
    const colTemplate = cols.map(c => c.width || "1fr").join(" ");
    tableHeader.style.setProperty("--cols", colTemplate);
    tableBody.style.setProperty("--cols", colTemplate);
    tableHeader.innerHTML = cols.map(c => `<div>${c.label}</div>`).join("");

    renderTablePage();
  }

  // Pagination Events
  firstBtn.onclick = () => { currentPage = 1; renderTablePage(); };
  prevBtn.onclick  = () => { if (currentPage > 1) currentPage--; renderTablePage(); };
  nextBtn.onclick  = () => { currentPage++; renderTablePage(); };
  lastBtn.onclick  = () => {
    currentPage = Math.ceil(currentTableData.length / PAGE_SIZE);
    renderTablePage();
  };

  // ====== KPI & CHARTS ======
  function renderKPIData(filtered) {
    const total = filtered.filter(r => rowHasMeaningfulData(r)).length;
    
    // Tính toán tiến độ
    let avgProgress = "N/A";
    const percentKeys = ["Đánh giá tỉ lệ hoàn thành công việc", "Tỉ lệ hoàn thành"];
    for (const k of percentKeys) {
      const nums = filtered.map(r => {
        let val = String(r[k] ?? "");
        if(val.includes("%")) val = val.replace("%", "");
        return parseFloat(val);
      }).filter(n => !isNaN(n));
      
      if (nums.length) { 
          avgProgress = Math.round(nums.reduce((s, n) => s + n, 0) / nums.length) + "%"; 
          break; 
      }
    }

    kpiGrid.innerHTML = `
      <div class="kpi-card">
        <div class="kpi-label">Tổng số bản ghi</div>
        <div class="kpi-value-row">
          <div class="kpi-value">${total}</div>
          <div class="kpi-chip positive"><i class="fa-solid fa-arrow-trend-up"></i> Live</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Tỉ lệ hoàn thành TB</div>
        <div class="kpi-value-row">
          <div class="kpi-value">${avgProgress}</div>
          <div class="kpi-chip"><i class="fa-solid fa-clipboard-check"></i> Progress</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Năm đang lọc</div>
        <div class="kpi-value-row">
          <div class="kpi-value">${yearFilter.value === "all" ? "Tất cả" : yearFilter.value}</div>
          <div class="kpi-chip warning"><i class="fa-solid fa-filter"></i> Scope</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Loại dữ liệu</div>
        <div class="kpi-value-row">
          <div class="kpi-value">${TYPE_SCHEMAS[dataTypeFilter.value].label}</div>
          <div class="kpi-chip"><i class="fa-solid fa-database"></i> Sheet</div>
        </div>
      </div>
    `;
  }

  const COMMON_CHART_OPTIONS = {
    plugins: {
      legend: { labels: { color: "#9ca3af", font: { size: 11 }, boxWidth: 12 } },
      tooltip: { bodyFont: { size: 11 }, titleFont: { size: 11 } }
    }
  };

  function renderMonthChart(filtered) {
    const months = Array.from({ length: 12 }, (_, i) => i + 1);
    const data = months.map(m => filtered.filter(r => getMonth(r) === m && rowHasMeaningfulData(r)).length);

    const ctx = document.getElementById("monthChart").getContext("2d");
    if (chart) chart.destroy();
    chart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: months.map(m => "T" + m.toString().padStart(2, "0")),
        datasets: [{
          label: `Số bản ghi`,
          data: data,
          backgroundColor: MONTH_PALETTE,
          borderRadius: 4,
          barPercentage: 0.7
        }]
      },
      options: {
        indexAxis: 'y', responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { grid: { display: false }, ticks: { color: "#9ca3af" } },
          x: { grid: { color: "rgba(55, 65, 81, 0.2)" }, ticks: { color: "#9ca3af" } }
        }
      }
    });
  }

  function renderPieChart() {
    // Filter helper
    const filterWithAllControls = ds => ds.filter(r => {
      const y = getYear(r), m = getMonth(r);
      if (yearFilter.value !== "all" && String(y) !== String(yearFilter.value)) return false;
      if (monthFilter.value !== "all" && String(m) !== String(monthFilter.value)) return false;
      return true;
    });

    const qlktCount = filterWithAllControls(dataQLKT).filter(r => rowHasMeaningfulData(r)).length;
    const trinhvbCount = filterWithAllControls(dataTRINH_VB).filter(r => rowHasMeaningfulData(r)).length;
    const nghiemthuCount = filterWithAllControls(dataNGHIEM_THU_NB).filter(r => rowHasMeaningfulData(r)).length;
    const nhantrahsCount = filterWithAllControls(dataNHANTRAHS).filter(r => rowHasMeaningfulData(r)).length;

    const ctx = document.getElementById("pieChart").getContext("2d");
    if (pie) pie.destroy();
    pie = new Chart(ctx, {
      type: "pie",
      data: {
        labels: ["QLKT", "Trình VB", "Nghiệm thu NB", "Nhận/Trả HS"],
        datasets: [{
          data: [qlktCount, trinhvbCount, nghiemthuCount, nhantrahsCount],
          backgroundColor: ["#60a5fa", "#34d399", "#fbbf24", "#f472b6"],
          borderColor: "#ffffff", borderWidth: 1
        }]
      },
      options: Object.assign({}, COMMON_CHART_OPTIONS, {
        responsive: true,
        plugins: { legend: { position: "bottom" } }
      })
    });
  }

  function populateBreakdownOptions() {
    const candidateFields = [
      "Chuyên viên phụ trách", "Đơn vị thực hiện", "Chủ nhiệm", "Mục đích trình",
      "Lãnh đạo ký", "Nhân viên soạn thảo văn bản", "Đánh giá tỉ lệ hoàn thành công việc",
      "Tên dự án", "Người nhận HS", "Ghi chú"
    ];

    let sourceData = getCurrentSourceData();
    
    // Lấy các trường có dữ liệu thực tế
    const available = candidateFields.filter(f => {
      return sourceData.some(r => {
         const val = r[f];
         return val !== undefined && val !== null && String(val).trim() !== "";
      });
    });

    breakdownField.innerHTML = `<option value="none">Chọn trường để phân tích</option>` +
      available.map(k => `<option value="${encodeURIComponent(k)}">${k}</option>`).join("");

    breakdownField.value = "none";
    if (breakdownChart) { breakdownChart.destroy(); breakdownChart = null; }
  }

  function renderBreakdownPie(fieldKeyEncoded) {
    if (!fieldKeyEncoded || fieldKeyEncoded === "none") {
      if (breakdownChart) { breakdownChart.destroy(); breakdownChart = null; }
      return;
    }
    const fieldKey = decodeURIComponent(fieldKeyEncoded);
    let filtered = applyFiltersToData(getCurrentSourceData()).filter(r => rowHasMeaningfulData(r));

    const counts = new Map();
    filtered.forEach(r => {
      let v = r[fieldKey];
      if (v === null || v === undefined || String(v).trim() === "") return;
      const key = String(v);
      counts.set(key, (counts.get(key) || 0) + 1);
    });

    if (counts.size === 0) return;

    const items = Array.from(counts.entries()).sort((a,b)=>b[1]-a[1]);
    const top = items.slice(0, 10);
    const others = items.slice(10);
    const labels = top.map(i => i[0]);
    const data = top.map(i => i[1]);
    if (others.length) {
      labels.push("Khác");
      data.push(others.reduce((s,i)=>s+i[1],0));
    }

    const ctx = document.getElementById("breakdownPie").getContext("2d");
    if (breakdownChart) breakdownChart.destroy();
    breakdownChart = new Chart(ctx, {
      type: "pie",
      data: { labels, datasets: [{ data, backgroundColor: MONTH_PALETTE, borderWidth: 1 }] },
      options: Object.assign({}, COMMON_CHART_OPTIONS, {
        responsive: true,
        plugins: { legend: { position: "bottom", display: false } } // Hide legend if too many items
      })
    });
  }

  // ====== MAIN LOGIC HANDLERS ======
  function getCurrentSourceData() {
    if (dataTypeFilter.value === "QLKT") return dataQLKT;
    if (dataTypeFilter.value === "TRINH_VB") return dataTRINH_VB;
    if (dataTypeFilter.value === "NGHIEM_THU_NB") return dataNGHIEM_THU_NB;
    if (dataTypeFilter.value === "NHANTRAHS") return dataNHANTRAHS;
    return [...dataQLKT, ...dataTRINH_VB, ...dataNGHIEM_THU_NB, ...dataNHANTRAHS];
  }

  function updateAll() {
    const type = dataTypeFilter.value;
    const schema = TYPE_SCHEMAS[type];
    
    // Nếu chọn Tổng Cộng, không cần filter data theo cách thường
    if (type === "TONG_CONG") {
        renderTable(schema, []); // Logic tổng cộng nằm trong renderTable
        kpiGrid.innerHTML = ""; // Xóa hoặc tùy chỉnh KPI cho tổng cộng
        if (chart) chart.destroy();
        renderPieChart();
        return;
    }

    const data = getCurrentSourceData();
    const filtered = applyFiltersToData(data);

    renderKPIData(filtered);
    renderMonthChart(filtered);
    renderPieChart();
    renderTable(schema, filtered);
    
    // Reset breakdown khi đổi loại dữ liệu
    populateBreakdownOptions();
  }

  function aggregateYearCounts() {
    const allYears = new Map();
    
    const process = (dataArr, keyName) => {
        dataArr.forEach(r => {
            if (!rowHasMeaningfulData(r)) return;
            const y = getYear(r);
            if (!y) return;
            
            if (!allYears.has(y)) {
                allYears.set(y, { Year: y, QLKT_Count: 0, TRINH_VB_Count: 0, NGHIEM_THU_NB_Count: 0, NHANTRAHS_Count: 0, TOTAL_Count: 0 });
            }
            const entry = allYears.get(y);
            entry[keyName]++;
            entry.TOTAL_Count++;
        });
    };

    process(dataQLKT, "QLKT_Count");
    process(dataTRINH_VB, "TRINH_VB_Count");
    process(dataNGHIEM_THU_NB, "NGHIEM_THU_NB_Count");
    process(dataNHANTRAHS, "NHANTRAHS_Count");

    return Array.from(allYears.values()).sort((a,b) => b.Year - a.Year);
  }

  // ====== INITIALIZATION ======
  async function init() {
    try {
      loadingKpi.style.display = "block";
      
      const [d1, d2, d3, d4] = await Promise.all([
        fetchSheetJSON(SPREADSHEET_ID_MAIN, SHEET_NAME_DUAN),
        fetchSheetJSON(SPREADSHEET_ID_MAIN, SHEET_NAME_TRINHKY),
        fetchSheetJSON(SPREADSHEET_ID_MAIN, SHEET_NAME_NGHIEMTHU),
        fetchSheetJSON(SPREADSHEET_ID_HS, SHEET_NAME_NHANTRAHS)
      ]);

      dataQLKT = parseTable(d1);
      dataTRINH_VB = parseTable(d2);
      dataNGHIEM_THU_NB = parseTable(d3);
      dataNHANTRAHS = parseTable(d4);

      // Populate Year Filter from all data
      const allYears = new Set();
      [...dataQLKT, ...dataTRINH_VB, ...dataNGHIEM_THU_NB, ...dataNHANTRAHS].forEach(r => {
          const y = getYear(r);
          if (y) allYears.add(y);
      });
      const sortedYears = Array.from(allYears).sort((a,b)=>b-a);
      sortedYears.forEach(y => {
          const opt = document.createElement("option");
          opt.value = y; opt.textContent = y;
          yearFilter.appendChild(opt);
      });

      loadingKpi.style.display = "none";
      updateAll();

    } catch (e) {
      console.error(e);
      loadingKpi.style.display = "none";
      errorBox.style.display = "block";
      errorBox.textContent = "Lỗi tải dữ liệu: " + e.message;
    }
  }

  // Events
  dataTypeFilter.addEventListener("change", updateAll);
  yearFilter.addEventListener("change", updateAll);
  monthFilter.addEventListener("change", updateAll);
  breakdownField.addEventListener("change", (e) => renderBreakdownPie(e.target.value));

  // Start app
  init();

</script>
</body>
